name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'packaging/pyinstaller/requirements-build.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r packaging/pyinstaller/requirements-build.txt

      - name: Build Windows package
        shell: cmd
        run: scripts\build\build_windows.cmd

      - name: Zip Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path "build-output\dist\IconBundler.exe")) { throw "Windows executable was not created." }
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $outDir = "release\artifacts\windows"
          if (Test-Path $outDir) { Remove-Item -Recurse -Force $outDir }
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Compress-Archive -Path "build-output\dist\IconBundler.exe" -DestinationPath "$outDir\IconBundler-$version-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/artifacts/windows/IconBundler-*-windows.zip

  build-macos-arm64:
    runs-on: macos-15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-arm64-py312-${{ hashFiles('requirements.txt', 'packaging/pyinstaller/requirements-build.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-arm64-py312-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r packaging/pyinstaller/requirements-build.txt

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MACOS_SIGNING_IDENTITY"
          KEYCHAIN_PATH="$RUNNER_TEMP/icon-bundler-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          python3 -c 'import base64,os; open(os.environ["RUNNER_TEMP"] + "/developer-id.p12", "wb").write(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))'
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$MACOS_SIGNING_IDENTITY"

      - name: Build macOS package
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          chmod +x scripts/build/build_macos.sh
          ./scripts/build/build_macos.sh

      - name: Notarize macOS app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          APP="$PWD/build-output/dist/IconBundler.app"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARY_ZIP="$RUNNER_TEMP/IconBundler-notarize.zip"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Zip macOS app
        run: |
          test -x "build-output/dist/IconBundler.app/Contents/MacOS/IconBundler"
          version="${GITHUB_REF_NAME#v}"
          out_dir="release/artifacts/macos"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          ditto -c -k --sequesterRsrc --keepParent "build-output/dist/IconBundler.app" "$out_dir/IconBundler-${version}-macos-arm64.zip"

      - name: Clean up signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/icon-bundler-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/IconBundler-notarize.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: release/artifacts/macos/IconBundler-*-macos-arm64.zip

  build-macos-x86_64:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-x64-py312-${{ hashFiles('requirements.txt', 'packaging/pyinstaller/requirements-build.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-x64-py312-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r packaging/pyinstaller/requirements-build.txt

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MACOS_SIGNING_IDENTITY"
          KEYCHAIN_PATH="$RUNNER_TEMP/icon-bundler-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          python3 -c 'import base64,os; open(os.environ["RUNNER_TEMP"] + "/developer-id.p12", "wb").write(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))'
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$MACOS_SIGNING_IDENTITY"

      - name: Build macOS package
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          chmod +x scripts/build/build_macos.sh
          ./scripts/build/build_macos.sh

      - name: Notarize macOS app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          APP="$PWD/build-output/dist/IconBundler.app"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARY_ZIP="$RUNNER_TEMP/IconBundler-notarize.zip"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Zip macOS app
        run: |
          test -x "build-output/dist/IconBundler.app/Contents/MacOS/IconBundler"
          version="${GITHUB_REF_NAME#v}"
          out_dir="release/artifacts/macos"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          ditto -c -k --sequesterRsrc --keepParent "build-output/dist/IconBundler.app" "$out_dir/IconBundler-${version}-macos-x86_64.zip"

      - name: Clean up signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/icon-bundler-build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/IconBundler-notarize.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-release
          path: release/artifacts/macos/IconBundler-*-macos-x86_64.zip

  build-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-tk

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'packaging/pyinstaller/requirements-build.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r packaging/pyinstaller/requirements-build.txt

      - name: Build Linux package
        run: |
          chmod +x scripts/build/build_linux.sh
          ./scripts/build/build_linux.sh

      - name: Archive Linux package
        run: |
          test -x "build-output/dist/IconBundler"
          version="${GITHUB_REF_NAME#v}"
          out_dir="release/artifacts/linux"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          tar -czf "$out_dir/IconBundler-${version}-linux-x86_64.tar.gz" -C build-output/dist IconBundler

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/artifacts/linux/IconBundler-*-linux-x86_64.tar.gz

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos-arm64
      - build-macos-x86_64
      - build-linux
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/artifacts/windows

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: release/artifacts/macos

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-release
          path: release/artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release/artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/artifacts/windows/IconBundler-*-windows.zip
            release/artifacts/macos/IconBundler-*-macos-arm64.zip
            release/artifacts/macos/IconBundler-*-macos-x86_64.zip
            release/artifacts/linux/IconBundler-*-linux-x86_64.tar.gz
